services:
  - type: web
    name: ssd-vbj2-apresentacao
    runtime: static
    buildCommand: node demo/build.mjs
    staticPublishPath: demo/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
