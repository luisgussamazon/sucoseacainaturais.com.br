<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#131921" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · Amazonitos Store</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #131921;
        font:
          16px/1.6 system-ui,
          sans-serif;
        padding: 24px;
      }
      main {
        max-width: 420px;
        background: white;
        padding: 32px;
        border: 1px solid #e5e9ef;
        border-radius: 22px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 25px;
        line-height: 1.2;
      }
      p {
        color: #596575;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        background: #ff9900;
        border-radius: 12px;
        padding: 12px 22px;
        color: #131921;
        text-decoration: none;
        font-weight: 700;
      }
      a:focus-visible {
        outline: 3px solid #a65d00;
        outline-offset: 4px;
      }
      small {
        display: block;
        font-size: 12px;
        color: #647183;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand.svg" alt="Amazonitos" />
      <h1>Vamos nos reconectar?</h1>
      <p>
        Você está sem conexão. Conecte-se à internet para acessar sua conta,
        consultar o saldo e realizar resgates.
      </p>
      <a href="/">Tentar novamente</a
      ><small
        >Seus dados de conta e carteira não ficam disponíveis offline.</small
      >
    </main>
  </body>
</html>
